<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 300">
<rect width="180" height="300" fill="#2a1a12"/>
<!-- back wall and masking unit -->
<rect x="22" y="14" width="136" height="34" fill="#3a2418"/>
<rect x="34" y="20" width="112" height="16" fill="#e9dcc2"/>
<rect x="34" y="27" width="112" height="3" fill="#c23a2a"/>
<rect x="50" y="48" width="80" height="14" fill="#140c08"/>
<!-- gutters and lane -->
<polygon points="14,292 58,62 122,62 166,292" fill="#1c110b"/>
<polygon points="22,292 62,62 118,62 158,292" fill="#c8843e"/>
<!-- boards -->
<g stroke="#a8652a" stroke-width=".6" opacity=".55">
<line x1="40" y1="292" x2="72" y2="62"/><line x1="58" y1="292" x2="81" y2="62"/><line x1="76" y1="292" x2="88" y2="62"/>
<line x1="94" y1="292" x2="94" y2="62"/><line x1="112" y1="292" x2="101" y2="62"/><line x1="130" y1="292" x2="108" y2="62"/><line x1="148" y1="292" x2="115" y2="62"/>
</g>
<!-- oil: gloss over the front of the lane -->
<polygon points="22,292 49,140 131,140 158,292" fill="#f6d9a6" opacity=".22"/>
<polygon points="40,292 58,190 122,190 140,292" fill="#fff2d6" opacity=".12"/>
<!-- arrows -->
<g fill="#7a4418"><polygon points="62,214 65,206 68,214"/><polygon points="78,214 81,206 84,214"/><polygon points="94,214 97,206 100,214"/><polygon points="110,214 113,206 116,214"/></g>
<!-- burned tracks: matte where balls have rolled -->
<path d="M92,288 Q50,170 96,104" fill="none" stroke="#6e3c16" stroke-width="7" opacity=".5"/>
<path d="M92,288 Q50,170 96,104" fill="none" stroke="#6e3c16" stroke-width="3" opacity=".45"/>
<path d="M124,288 Q140,170 87,104" fill="none" stroke="#6e3c16" stroke-width="5" opacity=".18"/>
<!-- pass ticks on the worn track -->
<g fill="#2a1a12" opacity=".8"><rect x="56" y="150" width="4" height="1.6"/><rect x="56" y="154" width="4" height="1.6"/><rect x="56" y="158" width="4" height="1.6"/><rect x="56" y="162" width="4" height="1.6"/><rect x="56" y="166" width="4" height="1.6"/></g>
<!-- last ball's real path: broke late, arrived past the ring -->
<path d="M92,288 Q48,168 100,103" fill="none" stroke="#f2e6cf" stroke-width="1" stroke-dasharray="2 2" opacity=".75"/>
<!-- pins -->
<g fill="#f2e6cf">
<rect x="70" y="72" width="5" height="10" rx="2"/><rect x="82" y="72" width="5" height="10" rx="2"/><rect x="94" y="72" width="5" height="10" rx="2"/><rect x="106" y="72" width="5" height="10" rx="2"/>
<rect x="76" y="80" width="5" height="11" rx="2"/><rect x="88" y="80" width="5" height="11" rx="2"/><rect x="100" y="80" width="5" height="11" rx="2"/>
<rect x="82" y="88" width="5.5" height="11" rx="2"/><rect x="94" y="88" width="5.5" height="11" rx="2"/>
<rect x="87.5" y="96" width="6" height="12" rx="2.4"/>
</g>
<g fill="#c23a2a">
<rect x="70" y="74" width="5" height="1.4"/><rect x="82" y="74" width="5" height="1.4"/><rect x="94" y="74" width="5" height="1.4"/><rect x="106" y="74" width="5" height="1.4"/>
<rect x="76" y="82" width="5" height="1.4"/><rect x="88" y="82" width="5" height="1.4"/><rect x="100" y="82" width="5" height="1.4"/>
<rect x="82" y="90.5" width="5.5" height="1.5"/><rect x="94" y="90.5" width="5.5" height="1.5"/>
<rect x="87.5" y="98.5" width="6" height="1.6"/>
</g>
<!-- aim ring, moved in to chase -->
<ellipse cx="93" cy="110" rx="8" ry="3" fill="none" stroke="#c23a2a" stroke-width="1.6"/>
<!-- bend handle -->
<polygon points="68,184 72,178 76,184 72,190" fill="#c23a2a"/>
<!-- drawn line -->
<path d="M92,282 Q52,172 93,110" fill="none" stroke="#f2e6cf" stroke-width=".8" opacity=".9"/>
<!-- the ball in hand: sanded strike ball -->
<circle cx="92" cy="282" r="9" fill="#a8322a"/>
<circle cx="89" cy="279" r="1.2" fill="#2a1a12"/><circle cx="93" cy="278" r="1.2" fill="#2a1a12"/><circle cx="91" cy="283" r="1.4" fill="#2a1a12"/>
<!-- the bag: plastic spare ball waiting -->
<circle cx="164" cy="284" r="7" fill="#9fc3c9" opacity=".85"/>
<path d="M159,282 Q164,278 169,285" fill="none" stroke="#f2e6cf" stroke-width="1" opacity=".8"/>
<rect x="148" y="273" width="28" height="22" rx="3" fill="none" stroke="#e9dcc2" stroke-width=".8" opacity=".5"/>
<text x="158" y="270" font-family="monospace" font-size="6" fill="#e9dcc2">BAG</text>
</svg>
