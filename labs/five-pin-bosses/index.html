<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Five-Pin Boss Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-screen app. score sheet on top, pixel lane fills the middle, throw button at the thumb */
  --ink:#1d100a;
  --panel:#3a2016;
  --chalk:#f3e2b8;
  --dim:#c9a878;
  --accent:#d86a28;
  --go:#d83a2a;
  --go-ink:#fff8e8;
  --paper:#f3e2b8;
  --paper-ink:#2a160e;
  --paper-dim:#7a4a2c;
  --now:#d83a2a;
  --made:#58a878;
  --coin:#ffd866;
  --pt:#f3e2b8;
  --mu:#ff8a4a;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Pixelify Sans",system-ui,sans-serif;
  --num:"Silkscreen",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
body[data-stage="night"]{
  --ink:#05071a;
  --panel:#141a44;
  --chalk:#f2f6ff;
  --dim:#9aa8de;
  --accent:#3fe0ff;
  --go:#ff4fa8;
  --go-ink:#05071a;
  --paper:#0c1030;
  --paper-ink:#f2f6ff;
  --paper-dim:#9aa8de;
  --now:#3fe0ff;
  --made:#ff4fa8;
  --coin:#ffd23f;
  --pt:#f2f6ff;
  --mu:#ff4fa8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:background-color .6s,color .6s}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ---- play HUD: rack strip + run meta + frame marks, then one score bar ---- */
.hud{display:flex;gap:6px;padding:max(6px,env(safe-area-inset-top)) 10px 0;align-items:stretch}
#rackBtn{flex:none;display:flex;align-items:flex-start;gap:3px;padding:3px 6px 1px;height:46px;background:var(--panel);border:2px solid var(--dim);border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.45)}
#rackBtn span{position:relative;display:block;width:18px;height:36px}
#rackBtn img{display:block;width:18px;height:36px;image-rendering:pixelated}
#rackBtn span:nth-child(2),#rackBtn span:nth-child(4){top:2px}
#rackBtn span:nth-child(3){top:4px}
#rackBtn span[data-lv]::after{content:attr(data-lv);position:absolute;right:-3px;top:-1px;font:400 8px/1 var(--num);color:var(--ink);background:var(--accent);padding:1px 2px}
.hudR{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.meta{display:flex;align-items:center;gap:8px;height:20px}
#title{display:flex;gap:3px;margin:0}
#title i{width:9px;height:9px;border:2px solid var(--dim)}
#title i.won{background:var(--dim)}
#title i.cur{background:var(--chalk);border-color:var(--chalk)}
#title{gap:2px}#title i{width:7px;height:7px}#title i.boss{border-radius:50%;border-color:var(--go)}#title i.boss.won{background:var(--go)}#title i:nth-child(3n){margin-right:4px}
#cash{font-family:var(--num);font-size:14px;line-height:1;color:var(--coin);margin-left:auto}
#camBtn{width:32px;height:20px;padding:0;display:grid;place-items:center;background:transparent;border:2px solid var(--dim);border-radius:3px}
#camBtn i{width:12px;height:10px;background:var(--chalk);clip-path:polygon(32% 0,68% 0,100% 100%,0 100%)}
#camBtn[data-cam="top"] i{width:8px;clip-path:none}
.board{display:flex;gap:4px}
.cell{flex:1;min-width:0;display:flex;justify-content:center;align-items:center;gap:4px;height:22px;background:transparent;color:var(--paper-ink);border:2px solid var(--panel);border-radius:2px;font:400 12px/1 var(--num);transition:background-color .6s,color .6s}
.cell.done,.cell.now{background:var(--paper)}
.cell.done{border-color:var(--paper)}
body[data-stage="night"] .cell.done{border-color:var(--panel)}
.cell.now{border-color:var(--now)}
.cell span{min-width:8px;text-align:center}
.cell span:empty::before{content:"";display:block;width:4px;height:4px;margin:auto;background:var(--dim)}
.cell.now span:empty::before{background:var(--paper-dim)}
.goal{display:flex;align-items:center;gap:6px;padding:5px 10px 5px;font-family:var(--num);font-variant-numeric:tabular-nums}
.goal b{font-weight:400;font-size:18px;line-height:18px;color:var(--chalk);min-width:26px}
.goal b+div+b{color:var(--accent);text-align:right}
.bar{flex:1;height:14px;position:relative;background:var(--panel);border:2px solid var(--dim);border-radius:2px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);transition:width .45s steps(8)}
.goal.made .bar{border-color:var(--made)}
.goal.made .bar i{background:var(--made)}
.goal.made b+div+b{color:var(--made)}
.bar u{position:absolute;right:3px;top:3px;display:none;gap:2px}
.goal.made .bar u{display:flex}
.bar u s{width:4px;height:4px;background:rgba(0,0,0,.35)}
.bar u s.on{background:var(--coin)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px}
canvas{display:block;touch-action:none;border-radius:6px;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.toast{position:absolute;left:0;right:0;top:47%;margin:0 auto;width:max-content;max-width:94%;transform:translateY(-50%);display:grid;grid-template-columns:auto auto;align-items:center;justify-content:center;gap:2px 10px;padding:6px 12px 7px;background:var(--ink);color:var(--chalk);border:3px solid var(--accent);border-radius:3px;box-shadow:0 4px 0 rgba(0,0,0,.5);font-family:var(--num);white-space:nowrap;pointer-events:none;opacity:0;max-width:96%}
.toast em{grid-row:span 2;font-style:normal;font-size:40px;line-height:40px;color:var(--accent)}
.toast strong{font-weight:400;font-size:30px;line-height:30px}
.toast em+strong{text-align:left}
.toast b{font-weight:400;font-size:13px;line-height:14px;color:var(--dim);display:flex;gap:5px;justify-content:center}
.toast em~b{justify-content:flex-start}
.toast strong:first-child,.toast strong:first-child+b{grid-column:1/-1;text-align:center}
.toast .pt{color:var(--pt)}.toast .mu{color:var(--mu)}.toast .ca{color:var(--coin)}
.toast p{grid-column:1/-1;margin:4px 0 0;padding-top:5px;border-top:2px solid var(--panel);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 9px;font-size:12px;line-height:1}
.toast p span{display:flex;align-items:center;gap:3px}
.toast p img{width:18px;height:36px;image-rendering:pixelated}
.hint{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
/* keep THROW clear of the iPhone home bar */
.controls{display:flex;gap:8px;padding:6px 10px max(22px,calc(env(safe-area-inset-bottom) + 10px));align-items:stretch}
.seg{display:flex;border:2px solid var(--dim);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:9px 10px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--ink)}
#throw{flex:1;border:3px solid var(--go);border-radius:4px;background:transparent;color:var(--chalk);font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.08em;min-height:52px;box-shadow:0 4px 0 rgba(0,0,0,.45)}
#throw.live{background:var(--go);color:var(--go-ink)}
#throw:disabled{background:transparent;border-color:var(--panel);color:transparent;box-shadow:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:2}
.sheet[hidden]{display:none}
.sheet .box{background:var(--panel);border-radius:10px;padding:18px;width:100%;max-width:340px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--display);font-size:22px}
.sheet p{margin:0;color:var(--dim);font-size:14px;line-height:1.45}
.sheet label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:14px}
.sheet label output{font-family:var(--num);color:var(--accent)}
.sheet input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1;padding:11px 12px;border-radius:8px;border:2px solid var(--dim);background:transparent;font-size:14px;font-weight:700}
/* ---------- overlay sheets: one screen, no scrolling ---------- */
body{--deck:#c98f52;--deck-line:#b47a40;--deck-ink:#2a160e;--deck-dim:#6b3f1e;--spot:rgba(42,22,14,.5);--tag:#d83a2a;--tag-ink:#fff8e8}
body[data-stage="night"]{--deck:#0c1030;--deck-line:#141a44;--deck-ink:#f2f6ff;--deck-dim:#9aa8de;--spot:rgba(63,224,255,.35);--tag:#ff4fa8;--tag-ink:#05071a}
.sheet{padding:max(8px,env(safe-area-inset-top)) 8px max(22px,calc(env(safe-area-inset-bottom) + 10px))}
.sheet .box{max-width:380px;padding:10px;gap:8px;overflow:hidden;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px rgba(255,255,255,.07)}
#shop .box{height:100%;max-height:660px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.shead h2{font-size:20px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.chip{position:relative;font-family:var(--num);font-weight:400;font-size:20px;line-height:1;color:var(--ink);background:var(--accent);padding:5px 9px 6px;border-radius:5px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.chip.bump{animation:bump .35s steps(4)}
.chip .fly{position:absolute;right:100%;top:3px;margin-right:8px;color:var(--accent);white-space:nowrap;animation:fly 1.6s steps(12) forwards}
@keyframes bump{50%{transform:translateY(-4px)}}
@keyframes fly{0%{opacity:0;transform:translateX(-22px)}15%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateX(14px)}}
/* offers: 2 x 2 cards, effect always on the card */
.offers{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.offer{position:relative;display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto 1fr;gap:2px 7px;align-content:start;text-align:left;height:80px;padding:5px 7px;border:2px solid var(--paper-dim);border-radius:6px;background:var(--paper);color:var(--paper-ink);box-shadow:0 3px 0 rgba(0,0,0,.4);transition:transform .12s,opacity .12s}
.offer strong{grid-column:1/-1;font-family:var(--display);font-size:13px;font-weight:700;line-height:1.25;padding-right:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offer img{align-self:start;justify-self:center;width:18px;height:36px;image-rendering:pixelated}
.offer img.gear{width:22px;height:22px;margin-top:3px}
.offer .d{font-size:11px;line-height:1.22;color:var(--paper-dim)}
.offer .d b,.strip p b{color:var(--paper-ink);font-weight:700}
.offer .c{position:absolute;top:-2px;right:-2px;min-width:28px;text-align:center;font-family:var(--num);font-size:13px;line-height:1;padding:4px 4px 5px;background:var(--tag);color:var(--tag-ink);border-radius:0 6px 0 6px}
.offer .g{position:absolute;left:6px;bottom:4px;font-family:var(--display);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-dim)}
.offer.poor{opacity:.5;box-shadow:none}
.offer.poor .c{background:var(--paper-dim);color:var(--paper);text-decoration:line-through}
.offer.got{opacity:1;background:transparent;border-style:dashed;border-color:var(--dim);box-shadow:none}
.offer.got>*{visibility:hidden}
.offer.got::after{content:"SOLD";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.2em;color:var(--dim)}
.offer.pend{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent),0 6px 0 rgba(0,0,0,.4);z-index:1}
.offer.pend .c{background:var(--ink);color:var(--chalk)}
.placing .offer:not(.pend):not(.got){opacity:.35}
.offers.nudge .offer:not(.poor):not(.got){animation:nudge .4s steps(6) 2}
/* three kinds for sale: row one pins, row two balls and gear; card = name, picture, price; what it does shows in the strip */
.offers{grid-template-columns:repeat(3,1fr)}
.offer{height:62px;grid-template-columns:1fr;grid-template-rows:auto 1fr;justify-items:center;padding:4px 5px}
.offer strong{font-size:11.5px;padding-right:24px;letter-spacing:-.01em;justify-self:start;max-width:100%}
.offer img{width:15px;height:30px}.offer img.gear{width:22px;height:22px;margin-top:4px}
.offer .g{left:5px;bottom:3px}
.lays{display:flex;gap:6px}
.lays button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:40px;padding:2px 4px;border:2px dashed var(--dim);border-radius:6px;background:transparent;color:var(--chalk);font-family:var(--display);font-size:11.5px;font-weight:700;line-height:1.1}
.lays button b{font-family:var(--num);font-weight:400;font-size:12px;color:var(--accent)}
.lays button.on{border-style:solid;border-color:var(--accent);background:rgba(255,255,255,.08)}
.lays button.on b{color:var(--dim)}
.lays button:disabled{opacity:.45}
.strip .buy{flex:none;margin-left:auto;padding:8px 10px;border-radius:6px;border:2px solid var(--accent);background:var(--accent);color:var(--ink);font-family:var(--display);font-size:13px;font-weight:700}
.strip .buy b{font-family:var(--num);font-weight:400}
.strip .buy:disabled{background:transparent;color:var(--dim);border-color:var(--dim);text-decoration:line-through}
.slot.ghost{border:2px dashed var(--deck-dim);background:transparent}
.slot.ghost .plus{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;color:var(--deck-dim)}
.slot.ghost b{color:var(--deck-ink)}
.slot.ghost.sel{border-style:solid;border-color:var(--deck-ink)}
@keyframes nudge{25%{transform:translateY(-4px)}75%{transform:translateY(2px)}}
/* one fixed detail strip */
.strip{flex:none;height:54px;display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:6px;background:var(--ink);color:var(--chalk);overflow:hidden}
.strip img{flex:none;width:18px;height:36px;image-rendering:pixelated}
.strip img.gear{width:22px;height:22px}
.strip div{min-width:0}
.strip h3{margin:0;font-family:var(--display);font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip h3 em{font-style:normal;font-family:var(--num);font-weight:400;font-size:11px;color:var(--accent);margin-left:5px}
.strip h3 small{font-family:var(--body);font-weight:400;font-size:11px;color:var(--dim);margin-left:7px}
.strip p{font-size:11.5px;line-height:1.25;color:var(--dim)}
.strip p b{color:var(--chalk)}
.strip.go{background:var(--accent);color:var(--ink)}
.strip.go h3{font-size:16px}
.strip.go p{color:var(--ink);font-weight:700;font-size:13px}
.strip .arrow{margin-left:auto;margin-right:4px;animation:bob .7s steps(3) infinite}
.tri{display:inline-block;width:0;height:0;border:6px solid transparent;border-top:9px solid currentColor;border-bottom:0}
.tri.r{border:5px solid transparent;border-left:8px solid currentColor;border-right:0;margin-left:5px}
.strip.tally{justify-content:center;gap:7px}
.tally b{font-family:var(--num);font-weight:400;font-size:18px;color:var(--chalk);white-space:nowrap}
.tally b small{font-size:13px;color:var(--dim)}
.tally span{font-family:var(--num);font-size:12px;line-height:1;white-space:nowrap;color:var(--accent);border:2px solid var(--accent);border-radius:4px;padding:4px 5px}
.tally span i{font-style:normal;font-family:var(--display);font-size:12px;color:var(--dim);margin-right:5px}
/* the rack as the bowler sees it: corners at the back, headpin at the front */
.deck{position:relative;flex:1 1 auto;min-height:190px;display:flex;border-radius:6px;padding:6px 8px;border:2px solid var(--ink);background:repeating-linear-gradient(90deg,var(--deck) 0 25px,var(--deck-line) 25px 26px)}
.sheet:not(#shop) .deck{flex:none;height:200px}
.rackmap{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:2px}
.maprow{display:flex;justify-content:space-between}
.maprow.r1{justify-content:center;gap:24px}
.maprow.r0{justify-content:center}
.slot{position:relative;width:92px;height:58px;display:grid;grid-template-columns:1fr 18px 1fr;grid-template-rows:36px 14px;align-items:center;justify-items:center;padding:1px 2px;border:2px solid transparent;border-radius:6px;background:radial-gradient(ellipse 15px 5px at 50% 35px,var(--spot) 97%,transparent);color:var(--deck-ink)}
.slot img{width:18px;height:36px;image-rendering:pixelated}
.slot .v{font-style:normal;font-family:var(--num);font-size:11px;line-height:1;justify-self:end;margin-right:7px;align-self:end;margin-bottom:5px;color:var(--deck-dim)}
.slot .lv{display:flex;flex-direction:column-reverse;gap:2px;justify-self:start;margin-left:7px;align-self:end;margin-bottom:5px}
.slot .lv u{width:7px;height:5px;background:transparent;border:1px solid var(--deck-dim)}
.slot .lv u.on{background:var(--deck-ink);border-color:var(--deck-ink)}
.slot .lv u.up{background:var(--tag);border-color:var(--tag);animation:blink .5s steps(2) infinite}
.slot b{grid-column:1/-1;font-family:var(--display);font-size:12px;font-weight:700;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.plain b{font-weight:500;color:var(--deck-dim)}
button.slot:active{transform:translateY(1px)}
.slot.sel{border-color:var(--deck-ink);background-color:rgba(255,255,255,.22)}
.swap .slot:not(.sel)::after{content:"⇄";position:absolute;top:1px;right:4px;font-size:15px;line-height:1;color:var(--deck-ink)}
.place .slot{border:2px dashed var(--deck-ink);background-color:rgba(255,255,255,.16)}
.place .slot::before{content:"";position:absolute;top:0;left:50%;margin-left:-24px;border:5px solid transparent;border-top:7px solid var(--tag);border-bottom:0;animation:bob .7s steps(3) infinite}
.placing .deck{box-shadow:0 0 0 3px var(--accent)}
@keyframes bob{50%{transform:translateY(4px)}}
@keyframes blink{50%{opacity:.25}}
/* gear shelf: front-left corner of the deck */
.shelf{position:absolute;right:8px;bottom:8px;width:88px;display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:4px}
.shelf button,.shelf span{width:26px;height:26px;padding:0;display:grid;place-items:center;border:2px solid var(--deck-dim);border-radius:5px;background:rgba(0,0,0,.18)}
.shelf img{width:22px;height:22px;image-rendering:pixelated}
.shelf .sel{border-color:var(--deck-ink);background:rgba(255,255,255,.3)}
.row{flex-wrap:nowrap}
.row button{padding:11px 8px;font-family:var(--display);font-size:15px;white-space:nowrap;min-width:0}
.row button.main{flex:1.7;background:var(--accent);border-color:var(--accent);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4)}
.row button b{font-family:var(--num);font-weight:400}
.row button:disabled{opacity:.4}
.placing .row button.main{background:transparent;color:var(--chalk);border-color:var(--dim);box-shadow:none}
/* end of run */
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.track span{flex:1;text-align:center;font-family:var(--num);font-size:11px;line-height:1;padding:6px 0;border-radius:4px;border:2px solid var(--dim);color:var(--dim)}
.track span.won{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.track span.lost{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.tally.big b{font-size:30px}.tally.big b small{font-size:15px}
#log .box{overflow:hidden}
#logText{flex:1 1 auto;min-height:60px}
@media (min-height:660px){
  .offer{height:72px;padding:6px 6px}.offer strong{font-size:13px}.offer img{width:18px;height:36px}.lays button{height:44px;font-size:12.5px}
  .strip{height:58px}.strip p{font-size:12.5px}
  .deck{min-height:256px}.sheet:not(#shop) .deck{height:262px}
  .slot{width:100px;height:80px;grid-template-columns:1fr 27px 1fr;grid-template-rows:56px 16px;background:radial-gradient(ellipse 21px 6px at 50% 53px,var(--spot) 97%,transparent)}
  .slot img{width:27px;height:54px}.slot b{font-size:13px}.slot .v{font-size:13px}.slot .lv u{width:9px;height:6px}
  .maprow.r1{gap:16px}.place .slot::before{margin-left:-28px}
}
/* ---------- shop shelves: each kind of thing for sale on its own framed tray ---------- */
#shop .box{gap:6px}
.tray{position:relative;flex:none;border:2px solid var(--ink);border-radius:6px;background:rgba(0,0,0,.3);padding:13px 6px 6px;margin-top:2px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.05)}
.tray[hidden]{display:none}
.ttag{position:absolute;top:-7px;left:8px;padding:1px 4px;border-radius:3px;background:var(--panel);font-family:var(--display);font-size:9px;font-weight:700;line-height:1;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tray .offers{display:grid;gap:6px}
.tray .offer{height:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:9px 3px 4px;text-align:center}
.tray .offer strong{grid-column:auto;justify-self:auto;padding:0;max-width:100%;font-size:11.5px;line-height:1.1;letter-spacing:0}
.tray .offer .c{top:-11px;left:50%;right:auto;transform:translateX(-50%);border-radius:4px;padding:3px 5px 4px;font-size:12px;min-width:30px;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.tray .offer.pend .c{background:var(--ink);color:var(--chalk)}
.tray .offer.got::after{font-size:11px;letter-spacing:.15em}
/* pins: cream cards, upright, with the reroll attached to the tray's right end */
.ptray{display:grid;grid-template-columns:1fr 54px;gap:6px}
.ptray .offers{grid-template-columns:repeat(3,1fr)}
.ptray .offer{height:56px}
.ptray .offer img{width:14px;height:28px;margin:0}
#shopReroll{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px 3px;border:2px solid var(--dim);border-radius:6px;background:var(--panel);color:var(--chalk);font-family:var(--display);font-size:11px;font-weight:700;line-height:1}
#shopReroll .ro{font-size:20px;line-height:.8;color:var(--chalk)}
#shopReroll b{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-family:var(--num);font-weight:400;font-size:12px;line-height:1;padding:3px 5px 4px;border-radius:4px;background:var(--tag);color:var(--tag-ink);box-shadow:0 2px 0 rgba(0,0,0,.45)}
#shopReroll:disabled{opacity:.45}
#shopReroll:active{transform:translateY(1px)}
/* lower shelf: balls on a dark ball-return rack, gear on a hang tag */
.trays{flex:none;display:grid;grid-template-columns:2fr 1fr;gap:6px}
.trays.solo{grid-template-columns:1fr}
.btray .offers{grid-template-columns:1fr 1fr}
.gtray .offers{grid-template-columns:1fr}
.btray .offer{height:50px;flex-direction:row;justify-content:flex-start;gap:6px;padding:4px 6px 4px 5px;border:2px solid var(--ink);border-radius:25px 6px 6px 25px;background:var(--panel);color:var(--chalk);box-shadow:0 3px 0 rgba(0,0,0,.45)}
.btray .offer .cradle{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--deck);box-shadow:inset 0 0 0 2px var(--ink),inset 0 -5px 0 rgba(0,0,0,.18)}
.btray .offer img.gear{width:22px;height:22px;margin:0}
.btray .offer strong{text-align:left;font-size:12px;white-space:normal}
.btray .offer.poor .c{color:var(--chalk);background:var(--paper-dim)}
.btray .offer.pend{border-color:var(--accent)}
.gtray .offer{height:50px;padding:8px 3px 4px;border:2px dashed var(--paper-dim);border-radius:4px 4px 12px 12px;background:var(--dim);box-shadow:0 3px 0 rgba(0,0,0,.45)}
.gtray .offer::before{content:"";position:absolute;top:5px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 1px var(--paper-dim)}
.gtray .offer img.gear{width:22px;height:22px;margin:0}
.gtray .offer.got::before{display:none}
.trays .offer.got{background:transparent;border:2px dashed var(--dim)}
/* next rack: three small rack diagrams drawn from LAYOUTS */
.ltray .lays{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ltray .lays button{position:relative;height:auto;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:3px 3px 3px;border:2px solid var(--ink);border-radius:5px;background:var(--panel);font-size:10px;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.ltray .lays button span{overflow:hidden;text-overflow:ellipsis;text-align:center}
.ltray .lays svg{display:block;width:100%;height:26px;border-radius:3px;shape-rendering:crispEdges}
.ltray .lays button b{position:absolute;top:-14px;right:4px;font-size:12px;line-height:1;padding:3px 5px 4px;border-radius:4px;background:var(--tag);color:var(--tag-ink);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.ltray .lays button.on{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 2px var(--accent)}
.ltray .lays button.on b{background:var(--ink);color:var(--dim)}
.ltray .lays button:disabled{opacity:.45}
.ltray .lays button:disabled b{text-decoration:line-through}
#shop .strip{height:48px}
#shop .deck{min-height:0;padding:3px 28px 11px}
#shop .slot{width:80px}
#shop .slot{height:54px;grid-template-rows:34px 14px;background:radial-gradient(ellipse 15px 5px at 50% 33px,var(--spot) 97%,transparent)}
#shop .slot img{width:17px;height:34px}
#shop .row button.main{flex:1}
.tray .offer img{align-self:center}
.ptray .offer{height:62px;padding-top:11px}
.tray .offer strong{line-height:1.15;flex:none}
.btray .offer,.gtray .offer{height:48px}
.gtray .offer{justify-content:center;padding-top:11px}
#shop .strip{height:44px}
#shop .row button{padding:9px 8px}
#shop .slot{height:46px;grid-template-rows:31px 12px;background:radial-gradient(ellipse 13px 4px at 50% 30px,var(--spot) 97%,transparent)}
#shop .slot img{width:15px;height:30px}
#shop .rackmap{gap:0}
#shop .strip .buy{min-height:40px}
.nudge .offer:not(.poor):not(.got){animation:nudge .4s steps(6) 2}
@media (min-height:660px){
  #shop .box{gap:8px}
  .tray{padding:14px 7px 7px}.ttag{font-size:10px;top:-8px}
  .ptray{grid-template-columns:1fr 60px}
  .ptray .offer{height:68px;padding-top:10px}.ptray .offer img{width:18px;height:36px}
  .tray .offer strong{font-size:12.5px}
  .ptray .offer{height:72px;padding-top:12px}
  .btray .offer,.gtray .offer{height:56px}
  #shop .strip{height:54px}#shop .row button{padding:11px 8px}
  .btray .offer{border-radius:28px 6px 6px 28px}.btray .offer .cradle{width:42px;height:42px}
  .ltray .lays svg{height:32px}.ltray .lays button{font-size:11px}
  #shop .slot{width:88px}
  #shop .strip{height:54px}
  #shop .slot{height:56px;grid-template-columns:1fr 20px 1fr;grid-template-rows:40px 13px;background:radial-gradient(ellipse 16px 5px at 50% 38px,var(--spot) 97%,transparent)}
  #shop .slot img{width:20px;height:40px}
}
@media (prefers-reduced-motion:reduce){.sheet *{animation:none!important;transition:none!important}}
.goal .marks{color:var(--chalk)}
</style>
</head>

<script>
//SIM-START
const G={L:60,R:300,BACK:30,FOUL:540,SY:520,EY:160,WL:38,WR:322};
// spots: headpin, left 3, right 3, left corner, right corner, then the two you can buy: back centre (between the corners), left flank (headpin row, in line with the left corner)
const SPOTS=[{x:180,y:160,v:5},{x:134,y:120,v:3},{x:226,y:120,v:3},{x:88,y:80,v:2},{x:272,y:80,v:2},{x:180,y:80,v:3},{x:88,y:160,v:3}];
// a layout moves spots, never closer together than the standard rack (61 px, headpin to a 3-pin)
const LAYOUTS={
  standard:{name:'Standard',move:()=>[0,0]},
  left:{name:'Shifted left',move:()=>[-16,0]},
  right:{name:'Shifted right',move:()=>[16,0]},
  headfwd:{name:'Headpin forward',move:i=>i===0?[0,30]:[0,0]},
  headleft:{name:'Headpin left',move:i=>i===0?[-22,20]:[0,0]},
  headright:{name:'Headpin right',move:i=>i===0?[22,20]:[0,0]}
};
function layoutSpots(id,n){return SPOTS.slice(0,n).map((p,i)=>{const m=LAYOUTS[id].move(i);return{x:p.x+m[0],y:p.y+m[1],v:p.v};});}
let RACK=layoutSpots('standard',5);
// boss rules. posts stop the ball (pins bounce off them); bolted pins fall to the ball, but only to a very hard hit from another pin (boltK, against KNOCK for a plain pin); a start side limits where the ball can start
const BOSSES={
  bolt:{name:'Bolted 3-pins',bolt:[1,2],boltK:400},
  corners:{name:'Bolted corners',bolt:[3,4],boltK:300},
  post:{name:'Centre post',posts:[{x:180,y:270,r:16}]},
  twin:{name:'Twin posts',posts:[{x:138,y:320,r:14},{x:222,y:320,r:14}]},
  left:{name:'Left-side start',side:-1},
  right:{name:'Right-side start',side:1}
};
let BOSS=null;
function startRange(){const a=G.L+RB+2,b=G.R-RB-2;return !BOSS||!BOSS.side?[a,b]:BOSS.side<0?[a,170]:[190,b];}
let RB=12,MB=2.2,FRIC=1.5;const BALLS={house:{rb:12,mb:2.2},big:{rb:15,mb:2.2},heavy:{rb:12,mb:3.6},light:{rb:12,mb:1.5},small:{rb:10,mb:2.2}};const RP=11,RT=21,MP=1,REST=.78,KNOCK=45;
let CARRY=1.5,KICK=-.9,DRIVE=0,MESS=.8;
const POW=[{speed:400,needle:.85},{speed:500,needle:1},{speed:620,needle:1.3}];
function rack(){return RACK.map((p,i)=>({x:p.x,y:p.y,v:p.v,vx:0,vy:0,down:false,gone:false,age:0,ang:0,bolt:!!(BOSS&&BOSS.bolt&&BOSS.bolt.includes(i))}));}
function makePath(sx,ex,bend){
  const S={x:sx,y:G.SY},E={x:ex,y:G.EY},C={x:(sx+ex)/2+bend,y:(G.SY+G.EY)/2};
  const pts=[],N=60;
  for(let i=0;i<=N;i++){const t=i/N,a=(1-t)*(1-t),b=2*t*(1-t),k=t*t;pts.push({x:a*S.x+b*C.x+k*E.x,y:a*S.y+b*C.y+k*E.y});}
  let tx=E.x-C.x,ty=E.y-C.y;const tl=Math.hypot(tx,ty);tx/=tl;ty/=tl;
  for(let d=8;d<=260;d+=8)pts.push({x:E.x+tx*d,y:E.y+ty*d});
  let stop=false;if(BOSS&&BOSS.posts)for(let i=1;i<pts.length&&!stop;i++)for(const o of BOSS.posts)if(Math.hypot(pts[i].x-o.x,pts[i].y-o.y)<o.r+RB){pts.length=i+1;stop=true;break;}
  const len=[0];for(let i=1;i<pts.length;i++)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  return{S,E,C,pts,len,stop};
}
function pathAt(p,d){
  const n=p.pts.length;if(d>=p.len[n-1]){const a=p.pts[n-2],b=p.pts[n-1],l=Math.hypot(b.x-a.x,b.y-a.y);return{x:b.x,y:b.y,dx:(b.x-a.x)/l,dy:(b.y-a.y)/l,end:true};}
  let i=1;while(p.len[i]<d)i++;
  const a=p.pts[i-1],b=p.pts[i],seg=p.len[i]-p.len[i-1],f=(d-p.len[i-1])/seg;
  return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,dx:(b.x-a.x)/seg,dy:(b.y-a.y)/seg,end:false};
}
function pinR(p,rt){if(!p.down)return RP;return RP+(rt-RP)*Math.min(1,p.age/0.1);}
function newSim(pins,path,power,spin){return{pins,path,t:0,done:false,ball:{spin:spin||0,x:path.S.x,y:path.S.y,vx:0,vy:0,d:0,speed:POW[power].speed,free:false,gutter:false,out:false}};}
function stepSim(s,dt){
  const b=s.ball;s.t+=dt;
  if(!b.out){
    if(b.gutter){b.y-=b.speed*.8*dt;}
    else if(!b.free){b.d+=b.speed*dt;const q=pathAt(s.path,b.d);b.x=q.x;b.y=q.y;b.vx=q.dx*b.speed;b.vy=q.dy*b.speed;if(q.end){if(s.path.stop){b.stuck=true;b.vx=b.vy=0;b.out=true;}else b.free=true;}
      if(b.x<G.L||b.x>G.R){b.gutter=true;b.x=b.x<G.L?G.L-11:G.R+11;}}
    else{b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.x<G.WL+RB){b.x=G.WL+RB;b.vx=Math.abs(b.vx)*.4;}if(b.x>G.WR-RB){b.x=G.WR-RB;b.vx=-Math.abs(b.vx)*.4;}
      if(b.vy>-40)b.vy-=300*dt;
      if(b.spin&&b.y>G.BACK+20)b.vx+=-Math.sign(b.spin)*Math.abs(b.spin)*DRIVE*dt;}
    if(b.y<G.BACK-16)b.out=true;
  }
  const P=s.pins,rt=RT*(1+MESS*Math.abs(b.spin));
  if(!b.out&&!b.gutter)for(const p of P){if(p.gone)continue;const r=RB+(p.down?RP:RP);
    let nx=p.x-b.x,ny=p.y-b.y;const d=Math.hypot(nx,ny);if(d>=r||d===0)continue;nx/=d;ny/=d;
    const vr=(b.vx-p.vx)*nx+(b.vy-p.vy)*ny;
    if(vr>0){const sp=Math.abs(b.spin),mb=MB*(1+CARRY*sp);const j=(1+REST)*vr/(1/mb+1/MP);b.vx-=j/mb*nx;b.vy-=j/mb*ny;p.vx+=j/MP*nx;p.vy+=j/MP*ny;
      if(sp){const hd=-Math.sign(b.spin),tx=-ny,ty=nx,sg=tx*hd>=0?1:-1,k=KICK*sp*vr;p.vx+=sg*tx*k;p.vy+=sg*ty*k;}
      if(!p.down){p.by='ball';p.ord=s.ord=(s.ord||0)+1;}p.down=true;b.free=true;}
    p.x=b.x+nx*r;p.y=b.y+ny*r;}
  for(let i=0;i<P.length;i++){const a=P[i];if(a.gone)continue;for(let k=i+1;k<P.length;k++){const c=P[k];if(c.gone)continue;
    const am=a.down&&(a.vx||a.vy),cm=c.down&&(c.vx||c.vy);if(!am&&!cm)continue;
    const r=pinR(a,rt)+pinR(c,rt);let nx=c.x-a.x,ny=c.y-a.y;const d=Math.hypot(nx,ny);if(d>=r||d===0)continue;nx/=d;ny/=d;
    const vr=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny;
    if(vr>0){
      const aFixed=!a.down&&vr<(a.bolt?BOSS.boltK:KNOCK),cFixed=!c.down&&vr<(c.bolt?BOSS.boltK:KNOCK);
      if(aFixed){c.vx+=(1+.5)*vr*nx;c.vy+=(1+.5)*vr*ny;}
      else if(cFixed){a.vx-=(1+.5)*vr*nx;a.vy-=(1+.5)*vr*ny;}
      else{const j=(1+REST)*vr/2;a.vx-=j*nx;a.vy-=j*ny;c.vx+=j*nx;c.vy+=j*ny;if(!a.down){a.by='pin';a.ord=s.ord=(s.ord||0)+1;}if(!c.down){c.by='pin';c.ord=s.ord=(s.ord||0)+1;}a.down=true;c.down=true;}
    }
    const ov=r-d;const aStill=!a.down,cStill=!c.down;
    if(aStill&&!cStill){c.x+=nx*ov;c.y+=ny*ov;}else if(cStill&&!aStill){a.x-=nx*ov;a.y-=ny*ov;}else if(!aStill&&!cStill){a.x-=nx*ov/2;a.y-=ny*ov/2;c.x+=nx*ov/2;c.y+=ny*ov/2;}
  }}
  let moving=false;const fr=Math.exp(-FRIC*dt);
  for(const p of P){if(p.gone||!p.down)continue;p.age+=dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=fr;p.vy*=fr;
    const r=RP;if(p.x<G.WL+r){p.x=G.WL+r;p.vx=Math.abs(p.vx)*.5;}if(p.x>G.WR-r){p.x=G.WR-r;p.vx=-Math.abs(p.vx)*.5;}
    if(BOSS&&BOSS.posts)for(const o of BOSS.posts){let nx=p.x-o.x,ny=p.y-o.y;const d=Math.hypot(nx,ny),rr=o.r+r;if(d>=rr||d===0)continue;nx/=d;ny/=d;p.x=o.x+nx*rr;p.y=o.y+ny*rr;const vn=p.vx*nx+p.vy*ny;if(vn<0){p.vx-=1.5*vn*nx;p.vy-=1.5*vn*ny;}}
    if(p.y<G.BACK){p.gone=true;p.vx=p.vy=0;continue;}
    const sp=Math.hypot(p.vx,p.vy);if(sp>1)p.ang=Math.atan2(p.vy,p.vx);
    if(sp<14){p.vx=p.vy=0;}else moving=true;}
  if((b.out||s.t>1.2&&b.free&&Math.hypot(b.vx,b.vy)<10)&&!moving)s.done=true;
  if(s.t>6)s.done=true;
}
function frameMarks(balls){const out=[];let sum=0,n=0;for(const v of balls){sum+=v;n++;if(sum===15){out.push(n===1?'X':n===2?'/':String(v));sum=0;n=0;}else out.push(v===0?'-':String(v));}return out;}
function scoreFrames(fr){const flat=[].concat(...fr);let idx=0,tot=0;const out=[];
  for(let i=0;i<fr.length;i++){const b=fr[i];let s=null;const g=k=>flat[idx+k]||0;
    if(b.length){s=b.reduce((a,v)=>a+v,0);
      if(i<fr.length-1){if(b[0]===15)s=15+g(1)+g(2);else if(b.length===2&&b[0]+b[1]===15)s=15+g(2);}
      tot+=s;}
    out.push(b.length?tot:null);idx+=b.length;}
  return out;}
//SIM-END

const OPT=(()=>{let q;try{q=new URLSearchParams(location.search);}catch(e){q=new URLSearchParams('');}return{layout:q.get('layout')!=='0',balls:q.get('balls')!=='0',spots:q.get('spots')!=='0'};})();
const FRAMES=3,TARGETS=[150,220,300,450,650,850,1100,1450,1800,2100,2600,3100],NIGHT_FROM=3;
const STAGES=['rec','night','computer','arrival'];
function stageOf(gi){return STAGES[Math.min(3,Math.floor(gi/3))];}

const BALLOFFERS={big:{name:'Big ball',cost:10,text:'A wider ball. Catches more pins.'},heavy:{name:'Heavy ball',cost:10,text:'A heavier ball. Drives through the pins.'},
  light:{name:'Light ball',cost:10,text:'A lighter ball. Glances off pins.'},small:{name:'Small ball',cost:10,text:'A narrower ball. Threads gaps.'}};
const SPOTCOST={5:6,6:8},LAYCOST=3;
function rackRun(){return rack().map((p,i)=>{p.slot=i;p.item=run.rack[i];p.kind=kindOf(p.item,i);return p;});}

function scoreBall(fell,left,fresh){const cleared=left.length===0&&fell.length>0,strike=cleared&&fresh,notes=[];let pts=0,m=1;

  if(fell.length===2||fell.length===3)for(const p of fell)if(p.item.t==='buddy'){m+=p.item.lv;notes.push('Buddy +'+p.item.lv);}
  if(fell.length)for(const p of left)if(p.item.t==='wall'){m+=p.item.lv;notes.push('Wallflower +'+p.item.lv);}
  if(cleared&&!strike)run.rack.forEach(it=>{if(it.t==='sweep'){m+=it.lv;notes.push('Sweeper +'+it.lv);}});

const NK={Gold:'gold',Wing:'wing',Domino:'domino',Twin:'twin',Trophy:'trophy',Bomb:'bomb',Picket:'picket',Leader:'leader',Buddy:'buddy',Wallflower:'wall',Sweeper:'sweep',Crown:'crown',Tip:'tip'},NM={leader:1,buddy:1,wall:1,sweep:1,crown:1};

// ---------- cameras: the sim stays in flat lane units, the camera only decides where they land on screen ----------
const CAM={
  lane:{id:'lane',horizon:68,
    proj(x,y){const z=851-y;return{X:90+(x-180)*212.5/z,Y:-47+96140/z,k:212.5/z};},
    inv(px,py){const z=96140/(py+.5+47);return{x:180+(px+.5-90)*z/212.5,y:851-z,k:212.5/z};},
    band(Y){return Y>192?'ball':Y>118?'bend':'aim';}},
  top:{id:'top',horizon:6,
    proj(x,y){return{X:x/2,Y:y/2,k:.5};},
    inv(px,py){return{x:px*2+1,y:py*2+1,k:.5};},
    band(Y){return Y>215?'ball':Y>117?'bend':'aim';}}
};
const HY={ball:G.SY,aim:G.EY,bend:(G.SY+G.EY)/2};

// pointer: three bands pick the handle, drag is relative so nothing jumps
let drag=null;
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*LW,y:(e.clientY-r.top)/r.height*LH};}
cv.addEventListener('pointerdown',e=>{if(g.mode!=='aim'||!$('shop').hidden||!$('rackSheet').hidden)return;if(g.ready){g.ready=false;setBtn();}g.keep=null;hint();const p=pt(e),cm=CAM[T.cam];const which=cm.band(p.y);
  drag={which,x0:p.x,v0:which==='ball'?g.sx:which==='aim'?g.ex:g.bx,k:cm.proj(180,HY[which]).k};try{cv.setPointerCapture(e.pointerId);}catch(_){ }e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(!drag||g.mode!=='aim')return;const dx=(pt(e).x-drag.x0)/drag.k;
  if(drag.which==='ball'){const sr=startRange();g.sx=clamp(drag.v0+dx,sr[0],sr[1]);}
  else if(drag.which==='aim')g.ex=clamp(drag.v0+dx,G.L+8,G.R-8);
  else g.bx=drag.v0+dx;
  fixBend();});

// ---------- pixel kit ----------
function mk(w,h){const k=document.createElement('canvas');k.width=w;k.height=h;return k;}
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

function ramp(cols,L,x,y){const n=cols.length-1;const v=Math.max(0,Math.min(.999,L))*n,i=Math.floor(v);return cols[(v-i)>thr(x,y)?i+1:i];}
const px=(k,x,y,w,h,col)=>{k.fillStyle=col;k.fillRect(Math.round(x),Math.round(y),w,h);};
function disc(k,cx,cy,r,col){k.fillStyle=col;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y+.6));k.fillRect(cx-w,cy+y,w*2+1,1);}}
function ringPx(k,cx,cy,rx,ry,col){k.fillStyle=col;const n=Math.ceil((rx+ry)*5);for(let i=0;i<n;i++){const a=i/n*6.28319;k.fillRect(Math.round(cx+Math.cos(a)*rx),Math.round(cy+Math.sin(a)*ry),1,1);}}
function plotLine(k,x0,y0,x1,y1,col){const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))));k.fillStyle=col;for(let i=0;i<=n;i++)k.fillRect(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),1,1);}
const FONT={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111',A:'111101111101101',B:'110101110101110',C:'111100100100111',D:'110101101101110',E:'111100111100111',F:'111100111100100',G:'111100101101111',H:'101101111101101',I:'111010010010111',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'111101101101101',O:'111101101101111',P:'111101111100100',R:'111101110101101',S:'111100111001111',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010','/':'001001010100100','-':'000000111000000',' ':'000000000000000'};

function sprite(rows,pal){const w=Math.max(...rows.map(r=>r.length)),k=mk(w,rows.length),q=k.getContext('2d');rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const col=pal[r[x]];if(col){q.fillStyle=col;q.fillRect(x,y,1,1);}}});return k;}

function shade(o,x,y,sx,sy,k){

  if(ax>=154){s=ax-296;u=Math.abs(s);nb=true;}
  if(u>=142)return o._cap;
  if(u>=120)return ramp(o._gut,(nb?.1:.2)+(u-120)/22*.6,sx,sy);
  const bf=(s+120)/BOARD,bi=Math.floor(bf),fr=bf-bi;
  let L=.52+((bi*37)%5-2)*.04+(hash(bi+(nb?40:0),Math.floor(y/(26+(bi%3)*9)))-.5)*.1;

  ringPx(c,X,Y,7,7,o.edge);ringPx(c,X,Y,6,6,'#c4ccd8');px(c,X-6,Y,2,1,'#2a2e38');px(c,X+5,Y,2,1,'#2a2e38');}
// the part of the approach a start-side boss closes: hatched
function drawClosed(o,cm){if(!BOSS||!BOSS.side)return;const sr=startRange(),x0=BOSS.side<0?sr[1]+RB:G.L,x1=BOSS.side<0?G.R:sr[0]-RB;
  for(let y=G.SY-30;y<=G.FOUL;y+=3){const a=cm.proj(x0,y),b=cm.proj(x1,y),Y=Math.round(a.Y);for(let X=Math.round(a.X);X<=Math.round(b.X);X++)if(((X+Y)&3)===0)px(c,X,Y,1,1,o.edge);}
  const a=cm.proj(BOSS.side<0?sr[1]+RB:sr[0]-RB,G.SY-30),b=cm.proj(BOSS.side<0?sr[1]+RB:sr[0]-RB,G.FOUL);plotLine(c,Math.round(a.X),Math.round(a.Y),Math.round(b.X),Math.round(b.Y),o.handle);}
function drawPin(o,cm,p){const q=cm.proj(p.x,p.y),X=Math.round(q.X),Y=Math.round(q.Y);if(p.bolt&&!p.down)drawBolt(o,cm,p);
  if(p.down){c.drawImage(o.pins[p.kind+(Math.cos(p.ang)<0?'l':'r')],X-9,Y-(cm.id==='lane'?7:4));return;}
  if(cm.id==='lane'){px(c,X-3,Y,7,2,o.shadow);c.save();c.globalAlpha=.2;c.translate(0,2*Y+2);c.scale(1,-1);c.drawImage(o.pins[p.kind],X-4,Y-17);c.restore();c.drawImage(o.pins[p.kind],X-4,Y-17);}
  else{px(c,X-3,Y+4,8,3,o.shadow);c.drawImage(o.pins[p.kind],X-4,Y-12);}}
function drawBall(o,cm,b){const q=cm.proj(b.x,b.y),X=Math.round(q.X),Y=Math.round(q.Y),r=clamp(Math.round(RB*q.k),2,11),B=o.ballsBy[run.ball];
  if(cm.id==='lane'){px(c,X-r+1,Y,2*r-1,2,o.shadow);c.drawImage(B[r],X-r,Y-2*r);return{X,Y:Y-r,r};}
  disc(c,X+1,Y+2,r,o.shadow);c.drawImage(B[r],X-r,Y-r);return{X,Y,r};}
function dots(o,cm,p,dim){let i=0;for(const q of p.pts){if(q.y<G.BACK)break;const s=cm.proj(q.x,q.y),X=Math.round(s.X),Y=Math.round(s.Y);
  if(dim){if(i%2===0)px(c,X,Y,1,1,o.dim);}else{px(c,X,Y+1,1,1,o.dotSh);px(c,X,Y,1,1,o.dot);}i++;}}
function label(o,s,x,y){txt(c,s,x+1,y+1,o.mark);txt(c,s,x,y,o.ink);}
function drawNeedle(o){const x0=22,w=136,y=284,h=8,mid=x0+w/2,half=w/2;
  px(c,0,y-6,LW,LH-(y-6),o.plate);
  px(c,x0-1,y-1,w+2,h+2,o.ui[0]);px(c,x0,y,w,h,o.ui[1]);
  const zz=g.mode==='aim'?zone():g.zoneAt,zw=Math.max(1,Math.round(half*zz));px(c,mid-zw,y,zw*2,h,o.ui[2]);
  if(!(g.mode==='aim'&&T.two&&!g.ready)){const n=g.mode==='aim'?tri(g.phase):g.stopped,nx=Math.round(mid+n*(half-1));px(c,nx-2,y-3,4,h+6,o.ui[0]);px(c,nx-1,y-2,2,h+4,o.ui[3]);}}
function draw(){
  const cm=CAM[T.cam],lane=cm.id==='lane';
  const o=buildTheme(THEME[fx?(fx.flip?fx.to:fx.from):stage]);
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.imageSmoothingEnabled=false;
  const hg=hallStep(o);
  if(fx)drawFx(cm);else c.drawImage(hallBg(o,cm,hg).cv,0,0);
  if(lane){const L=o.dispL,R=o.dispR,s=total()+'/'+run.target;
    px(c,L[0],L[1],L[2],L[3],L[4]);txt(c,'F'+(g.frame+1),L[0]+Math.floor((L[2]-7)/2),L[1]+Math.floor((L[3]-5)/2),L[5]);
    px(c,R[0],R[1],R[2],R[3],R[4]);txt(c,s,R[0]+Math.floor((R[2]-(s.length*4-1))/2),R[1]+Math.floor((R[3]-5)/2),R[5]);}
  if(!fx)hallLive(o,cm,hg,(lastT-HALL.t0)/1000);
  drawClosed(o,cm);

  const act=drag?drag.which:null,al=k=>act&&act!==k?.35:1;
  let aimPos=null,bendPos=null;
  if(g.mode==='aim'){if(g.last&&g.last.length>1){c.globalAlpha=.6;for(let i=1;i<g.last.length;i++){const a=cm.proj(g.last[i-1].x,g.last[i-1].y),b=cm.proj(g.last[i].x,g.last[i].y);plotLine(c,a.X,a.Y,b.X,b.Y,o.ink);}c.globalAlpha=1;}const p=makePath(g.sx,g.ex,g.bend);dots(o,cm,p,false);
    // aim ring: a mark on the floor in front of the headpin row
    const a=cm.proj(g.ex,G.EY+(lane?24:34)),AX=Math.round(a.X),AY=Math.round(a.Y),rx=lane?9:6,ry=lane?3:6;
    c.globalAlpha=al('aim');if(act==='aim')ringPx(c,AX,AY,rx+3,ry+2,o.hi);
    ringPx(c,AX,AY,rx+1,ry+1,o.edge);ringPx(c,AX,AY,rx,ry,o.handle);px(c,AX-rx-5,AY,4,1,o.handle);px(c,AX+rx+2,AY,4,1,o.handle);c.globalAlpha=1;
    aimPos={X:AX,Y:AY,rx};
  }else if(g.intended){dots(o,cm,g.intended,true);
    for(let i=1;i<g.trail.length;i++){const a=cm.proj(g.trail[i-1].x,g.trail[i-1].y),b=cm.proj(g.trail[i].x,g.trail[i].y);plotLine(c,a.X,a.Y+1,b.X,b.Y+1,o.dotSh);plotLine(c,a.X,a.Y,b.X,b.Y,o.trail);}}

  // pins and ball, far ones first
  const ents=[];for(const p of g.pins)if(!p.gone)ents.push({y:p.y,p});if(BOSS&&BOSS.posts)for(const q of BOSS.posts)ents.push({y:q.y,q});
  const b=g.sim?g.sim.ball:{x:g.sx,y:G.SY};if(!g.sim||!b.out)ents.push({y:b.y+.5,b});
  ents.sort((m,n)=>m.y-n.y);let ballPos=null;
  for(const e of ents){if(e.p)drawPin(o,cm,e.p);else if(e.q)drawPost(o,cm,e.q);else{if(g.mode==='aim')c.globalAlpha=al('ball');ballPos=drawBall(o,cm,e.b);
    if(g.mode==='aim'&&act==='ball')ringPx(c,ballPos.X,ballPos.Y,ballPos.r+3,ballPos.r+3,o.hi);c.globalAlpha=1;}}


  if(g.mode==='aim'){const s=cm.proj(g.bx,HY.bend),X=Math.round(s.X),Y=Math.round(s.Y);
    c.globalAlpha=al('bend');if(act==='bend')ringPx(c,X,Y,10,10,o.hi);
    c.fillStyle=o.edge;for(let d=-7;d<=7;d++){const w=7-Math.abs(d);c.fillRect(X-w,Y+d,2*w+1,1);}
    c.fillStyle=o.handle;for(let d=-6;d<=6;d++){const w=6-Math.abs(d);c.fillRect(X-w,Y+d,2*w+1,1);}
    px(c,X-4,Y,2,1,o.hi);px(c,X-3,Y-1,1,3,o.hi);px(c,X+3,Y,2,1,o.hi);px(c,X+3,Y-1,1,3,o.hi);c.globalAlpha=1;
    if(!run.thrown){label(o,'AIM',aimPos.X+aimPos.rx+8,aimPos.Y-2);label(o,'BEND',X+11,Y-2);if(ballPos)label(o,'START',ballPos.X+ballPos.r+4,ballPos.Y-2);}
  }
  drawNeedle(o);
}

const toastEl=$('toast');
let lastT=0,acc=0;
function loop(ts){const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;
  if(g.mode==='aim'&&g.ready)g.phase+=needleHz()*dt;
  if(g.mode==='roll'){acc+=dt;while(acc>1/240){tick(g.sim);acc-=1/240;}
    const b=g.sim.ball;if(!b.out)g.trail.push({x:b.x,y:b.y});
    if(g.sim.done){g.mode='settle';g.wait=.55;}}
  else if(g.mode==='settle'){g.wait-=dt;if(g.wait<=0)resolve();}
  if(g.toastT>0)g.toastT-=dt;
  toastEl.style.opacity=g.toast&&g.toastT>0?Math.min(1,g.toastT*2):0;
  if(fx){fx.t+=dt;if(!fx.flip&&fx.t>=.9){fx.flip=true;setChrome(fx.to);}
    if(fx.t>=(still?1.9:2.7)){stage=fx.to;fx=null;}}
  draw();requestAnimationFrame(loop);}
newRun();fit();requestAnimationFrame(loop);
</script>
</body>
