<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Changing Field Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  /* one-screen lab: score and frame marks on top, pixel lane fills the middle, throw button at the thumb */
  --ink:#1d100a;--panel:#3a2016;--chalk:#f3e2b8;--dim:#c9a878;--accent:#d86a28;--go:#d83a2a;--go-ink:#fff8e8;
  --paper:#f3e2b8;--paper-ink:#2a160e;--paper-dim:#7a4a2c;--now:#d83a2a;--pt:#f3e2b8;--mu:#ff8a4a;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--display:"Pixelify Sans",system-ui,sans-serif;--num:"Silkscreen",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hud{display:flex;gap:6px;padding:6px 10px;align-items:center}
#tot{font:400 20px/1 var(--num);min-width:44px;font-variant-numeric:tabular-nums}
.board{flex:1;min-width:0;display:flex;gap:3px}
.cell{flex:1;min-width:0;display:flex;justify-content:center;align-items:center;gap:2px;height:24px;color:var(--paper-ink);border:2px solid var(--panel);border-radius:2px;font:400 12px/1 var(--num)}
.cell.done,.cell.now{background:var(--paper)}
.cell.done{border-color:var(--paper)}
.cell.now{border-color:var(--now)}
.cell span{min-width:8px;text-align:center}
.cell span:empty::before{content:"";display:block;width:4px;height:4px;margin:auto;background:var(--dim)}
.cell.now span:empty::before{background:var(--paper-dim)}
.hud button{flex:none;height:24px;padding:0;background:transparent;border:2px solid var(--dim);border-radius:3px}
#logBtn{padding:0 5px;font:400 10px/1 var(--num)}
#camBtn{width:30px;display:grid;place-items:center}
#camBtn i{width:12px;height:10px;background:var(--chalk);clip-path:polygon(32% 0,68% 0,100% 100%,0 100%)}
#camBtn[data-cam="top"] i{width:8px;clip-path:none}
.stage{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px}
canvas{display:block;touch-action:none;border-radius:6px;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.toast{position:absolute;left:0;right:0;top:47%;margin:0 auto;width:max-content;max-width:96%;transform:translateY(-50%);display:grid;grid-template-columns:auto auto;align-items:center;justify-content:center;gap:2px 10px;padding:6px 12px 7px;background:var(--ink);color:var(--chalk);border:3px solid var(--accent);border-radius:3px;box-shadow:0 4px 0 rgba(0,0,0,.5);font-family:var(--num);white-space:nowrap;pointer-events:none;opacity:0}
.toast em{grid-row:span 2;font-style:normal;font-size:40px;line-height:40px;color:var(--accent)}
.toast strong{font-weight:400;font-size:30px;line-height:30px}
.toast em+strong{text-align:left}
.toast b{font-weight:400;font-size:13px;line-height:14px;color:var(--dim);display:flex;gap:5px;justify-content:center}
.toast em~b{justify-content:flex-start}
.toast strong:first-child,.toast strong:first-child+b{grid-column:1/-1;text-align:center}
.toast .pt{color:var(--pt)}.toast .mu{color:var(--mu)}
.fname{position:absolute;left:0;right:0;top:70%;margin:0 auto;width:max-content;padding:5px 10px 6px;background:var(--ink);color:var(--chalk);border:2px solid var(--dim);border-radius:3px;font:400 15px/1 var(--num);letter-spacing:.06em;white-space:nowrap;pointer-events:none;opacity:0}
.hint{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.controls{display:flex;padding:6px 10px 10px}
#throw{flex:1;border:3px solid var(--go);border-radius:4px;background:transparent;color:var(--chalk);font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.08em;min-height:52px;box-shadow:0 4px 0 rgba(0,0,0,.45)}
#throw.live{background:var(--go);color:var(--go-ink)}
#throw:disabled{background:transparent;border-color:var(--panel);color:transparent;box-shadow:none}
/* sheets: one screen, no scrolling */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:8px;z-index:2}
.sheet[hidden]{display:none}
.sheet .box{background:var(--panel);border-radius:10px;padding:10px;width:100%;max-width:380px;max-height:100%;overflow:hidden;display:flex;flex-direction:column;gap:8px;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px rgba(255,255,255,.07)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.sheet h2{margin:0;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.chip{font-family:var(--num);font-weight:400;font-size:26px;line-height:1;color:var(--ink);background:var(--accent);padding:5px 10px 7px;border-radius:5px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.list{display:flex;flex-direction:column;gap:4px}
.list div{display:grid;grid-template-columns:1fr auto 44px;align-items:center;gap:10px;height:34px;padding:0 9px;border-radius:5px;background:var(--paper);color:var(--paper-ink);font:400 13px/1 var(--num)}
.list i{font-style:normal;color:var(--paper-dim);letter-spacing:.2em}
.list b{font-weight:400;font-size:16px;text-align:right}
.row{display:flex;gap:8px}
.row button{flex:1;min-width:0;padding:11px 8px;border-radius:8px;border:2px solid var(--dim);background:transparent;font-family:var(--display);font-size:15px;font-weight:700;white-space:nowrap}
.row button.main{flex:1.7;background:var(--accent);border-color:var(--accent);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4)}
#logText{flex:1 1 auto;min-height:60px;width:100%;font:11px ui-monospace,Menlo,monospace;background:var(--ink);color:var(--chalk);border:1px solid var(--dim);border-radius:8px;padding:8px;-webkit-user-select:text;user-select:text;white-space:pre;overflow:auto}
</style>
</head>
<body>
<div class="hud">
  <b id="tot" aria-label="Score">0</b>
  <div class="board" id="board"></div>
  <button id="logBtn" type="button" aria-label="Results log">LOG</button>
  <button id="camBtn" type="button" aria-label="Change view"><i></i></button>
</div>
<div class="stage">
  <canvas id="lane" width="180" height="300" aria-label="Bowling lane. Drag the ball, the bend handle and the aim ring."></canvas>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div class="fname" id="fname"></div>
</div>
<p class="hint" id="hint"></p>
<div class="controls">
  <button id="throw" type="button">THROW</button>
</div>
<div class="sheet" id="over" hidden><div class="box">
  <div class="shead"><h2 id="overTitle"></h2><b class="chip" id="overTot"></b></div>
  <div class="list" id="overList"></div>
  <div class="row"><button id="overLog" type="button">Results log</button><button class="main" id="again" type="button">New game</button></div>
</div></div>
<div class="sheet" id="log" hidden><div class="box">
  <h2>Results log</h2>
  <textarea id="logText" readonly rows="14" aria-label="Results log"></textarea>
  <div class="row"><button id="logClear" type="button">Clear</button><button id="logCopy" type="button">Copy log</button><button class="main" id="logClose" type="button">Done</button></div>
</div></div>

<script>
//SIM-START
const G={L:60,R:300,BACK:30,FOUL:540,SY:520,EY:160,WL:38,WR:322};
// A field = where the five pins stand and what the lane does to the ball. Pins are [x,y,value]: the value travels with the pin.
const STD=[[180,160,5],[134,120,3],[226,120,3],[88,80,2],[272,80,2]];
const FIELDS=[
  {name:'WIDE ROW',pins:[[180,120,5],[134,120,3],[226,120,3],[88,120,2],[272,120,2]]},
  {name:'SLANT ROW',nameM:'SLANT ROW',pins:[[180,120,5],[140,140,3],[220,100,3],[100,160,2],[260,80,2]]},
  {name:'SPLIT RACK',nameM:'SPLIT RACK',pins:[[244,140,5],[266,104,3],[118,140,3],[222,104,2],[140,104,2]]},
  {name:'LEFT RACK',nameM:'RIGHT RACK',pins:[[140,160,5],[106,120,3],[174,120,3],[72,80,2],[208,80,2]]},
  {name:'LEFT RAIL',nameM:'RIGHT RAIL',rail:-1,pins:[[180,80,5],[140,120,3],[220,120,3],[100,160,2],[260,160,2]]},
  {name:'CENTRE POST',posts:[{x:180,y:270,r:16}]},
  {name:'TWIN POSTS',posts:[{x:138,y:320,r:14},{x:222,y:320,r:14}]},
  {name:'OIL STRIP',zones:[{x0:150,x1:210,y0:190,y1:545,f:0}]},
  {name:'DRY STRIP',zones:[{x0:60,x1:300,y0:230,y1:320,f:3}]},
  {name:'START LEFT',nameM:'START RIGHT',start:[74,128],zones:[{x0:60,x1:180,y0:190,y1:545,f:0}]}
];
function mirrorField(f){const m=x=>360-x,o={name:f.nameM,nameM:f.name,flip:!f.flip};
  if(f.pins)o.pins=f.pins.map(p=>[m(p[0]),p[1],p[2]]);
  if(f.posts)o.posts=f.posts.map(p=>({x:m(p.x),y:p.y,r:p.r}));
  if(f.zones)o.zones=f.zones.map(z=>({x0:m(z.x1),x1:m(z.x0),y0:z.y0,y1:z.y1,f:z.f}));
  if(f.rail)o.rail=-f.rail;
  if(f.start)o.start=[m(f.start[1]),m(f.start[0])];
  return o;}
let FIELD=FIELDS[0];
let RB=12,MB=2.2,FRIC=1.5;const RP=11,RT=21,MP=1,REST=.78,KNOCK=45,RAILB=.85;
let CARRY=1.5,KICK=-.9,DRIVE=0,MESS=.8;
const POW=[{speed:400,needle:.85},{speed:500,needle:1},{speed:620,needle:1.3}];
function rack(){return(FIELD.pins||STD).map(p=>({x:p[0],y:p[1],v:p[2],kind:'p'+p[2],vx:0,vy:0,down:false,gone:false,age:0,ang:0}));}
function hookAt(x,y){const z=FIELD.zones;if(z)for(const a of z)if(x>=a.x0&&x<a.x1&&y>=a.y0&&y<a.y1)return a.f;return 1;}
// The ball's line through the current field. On a bare lane this is the same curve as before (start, bend, aim);
// zones scale the hook where the ball is, a rail banks it, a post stops it. The preview and the roll both use this.
function makePath(sx,ex,bend){
  const N=90,h=1/N,dy=(G.SY-G.EY)/N,pts=[{x:sx,y:G.SY}],F=FIELD;let x=sx,y=G.SY,v=ex-sx+2*bend,stop=false,bank=0;
  for(let i=0;i<N+65&&!stop;i++){const a=i<N?-4*bend*hookAt(x,y):0;
    x+=v*h+.5*a*h*h;v+=a*h;y-=dy;
    if(F.rail&&y>G.BACK&&(x-180)*F.rail>120-RB){x=180+F.rail*(120-RB)*2-(x-180);v=-v*RAILB;bank++;}
    if(F.posts)for(const p of F.posts)if(Math.hypot(x-p.x,y-p.y)<p.r+RB)stop=true;
    pts.push({x,y});}
  const len=[0];for(let i=1;i<pts.length;i++)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  return{S:pts[0],pts,len,stop,bank};
}
function pathAt(p,d){
  const n=p.pts.length;if(d>=p.len[n-1]){const a=p.pts[n-2],b=p.pts[n-1],l=Math.hypot(b.x-a.x,b.y-a.y);return{x:b.x,y:b.y,dx:(b.x-a.x)/l,dy:(b.y-a.y)/l,end:true};}
  let i=1;while(p.len[i]<d)i++;
  const a=p.pts[i-1],b=p.pts[i],seg=p.len[i]-p.len[i-1],f=(d-p.len[i-1])/seg;
  return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,dx:(b.x-a.x)/seg,dy:(b.y-a.y)/seg,end:false};
}
function pinR(p,rt){if(!p.down)return RP;return RP+(rt-RP)*Math.min(1,p.age/0.1);}
function newSim(pins,path,power,spin){return{pins,path,t:0,done:false,ball:{spin:spin||0,x:path.S.x,y:path.S.y,vx:0,vy:0,d:0,speed:POW[power].speed,free:false,gutter:false,out:false,stuck:false}};}
function stepSim(s,dt){
  const b=s.ball,F=FIELD;s.t+=dt;
  if(!b.out){
    if(b.gutter){b.y-=b.speed*.8*dt;}
    else if(!b.free){b.d+=b.speed*dt;const q=pathAt(s.path,b.d);b.x=q.x;b.y=q.y;b.vx=q.dx*b.speed;b.vy=q.dy*b.speed;
      if(q.end){if(s.path.stop){b.stuck=b.out=true;b.vx=b.vy=0;}else b.free=true;}
      if(b.x<G.L||b.x>G.R){b.gutter=true;b.x=b.x<G.L?G.L-11:G.R+11;}}
    else{b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(F.rail&&(b.x-180)*F.rail>120-RB){b.x=180+F.rail*(120-RB);b.vx=-F.rail*Math.abs(b.vx)*RAILB;}
      if(b.x<G.WL+RB){b.x=G.WL+RB;b.vx=Math.abs(b.vx)*.4;}if(b.x>G.WR-RB){b.x=G.WR-RB;b.vx=-Math.abs(b.vx)*.4;}
      if(b.vy>-40)b.vy-=300*dt;
      if(b.spin&&b.y>G.BACK+20)b.vx+=-Math.sign(b.spin)*Math.abs(b.spin)*DRIVE*dt;}
    if(b.y<G.BACK-16)b.out=true;
  }
  const P=s.pins,rt=RT*(1+MESS*Math.abs(b.spin));
  if(!b.out&&!b.gutter)for(const p of P){if(p.gone)continue;const r=RB+RP;
    let nx=p.x-b.x,ny=p.y-b.y;const d=Math.hypot(nx,ny);if(d>=r||d===0)continue;nx/=d;ny/=d;
    const vr=(b.vx-p.vx)*nx+(b.vy-p.vy)*ny;
    if(vr>0){const sp=Math.abs(b.spin),mb=MB*(1+CARRY*sp);const j=(1+REST)*vr/(1/mb+1/MP);b.vx-=j/mb*nx;b.vy-=j/mb*ny;p.vx+=j/MP*nx;p.vy+=j/MP*ny;
      if(sp){const hd=-Math.sign(b.spin),tx=-ny,ty=nx,sg=tx*hd>=0?1:-1,k=KICK*sp*vr;p.vx+=sg*tx*k;p.vy+=sg*ty*k;}
      if(!p.down){p.by='ball';p.ord=s.ord=(s.ord||0)+1;}p.down=true;b.free=true;}
    p.x=b.x+nx*r;p.y=b.y+ny*r;}
  for(let i=0;i<P.length;i++){const a=P[i];if(a.gone)continue;for(let k=i+1;k<P.length;k++){const c=P[k];if(c.gone)continue;
    const am=a.down&&(a.vx||a.vy),cm=c.down&&(c.vx||c.vy);if(!am&&!cm)continue;
    const r=pinR(a,rt)+pinR(c,rt);let nx=c.x-a.x,ny=c.y-a.y;const d=Math.hypot(nx,ny);if(d>=r||d===0)continue;nx/=d;ny/=d;
    const vr=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny;
    if(vr>0){
      const aFixed=!a.down&&vr<KNOCK,cFixed=!c.down&&vr<KNOCK;
      if(aFixed){c.vx+=(1+.5)*vr*nx;c.vy+=(1+.5)*vr*ny;}
      else if(cFixed){a.vx-=(1+.5)*vr*nx;a.vy-=(1+.5)*vr*ny;}
      else{const j=(1+REST)*vr/2;a.vx-=j*nx;a.vy-=j*ny;c.vx+=j*nx;c.vy+=j*ny;if(!a.down){a.by='pin';a.ord=s.ord=(s.ord||0)+1;}if(!c.down){c.by='pin';c.ord=s.ord=(s.ord||0)+1;}a.down=true;c.down=true;}
    }
    const ov=r-d;const aStill=!a.down,cStill=!c.down;
    if(aStill&&!cStill){c.x+=nx*ov;c.y+=ny*ov;}else if(cStill&&!aStill){a.x-=nx*ov;a.y-=ny*ov;}else if(!aStill&&!cStill){a.x-=nx*ov/2;a.y-=ny*ov/2;c.x+=nx*ov/2;c.y+=ny*ov/2;}
  }}
  let moving=false;const fr=Math.exp(-FRIC*dt);
  for(const p of P){if(p.gone||!p.down)continue;p.age+=dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=fr;p.vy*=fr;
    const r=RP;if(p.x<G.WL+r){p.x=G.WL+r;p.vx=Math.abs(p.vx)*.5;}if(p.x>G.WR-r){p.x=G.WR-r;p.vx=-Math.abs(p.vx)*.5;}
    if(F.posts)for(const o of F.posts){let nx=p.x-o.x,ny=p.y-o.y;const d=Math.hypot(nx,ny),rr=o.r+r;if(d>=rr||d===0)continue;nx/=d;ny/=d;p.x=o.x+nx*rr;p.y=o.y+ny*rr;const vn=p.vx*nx+p.vy*ny;if(vn<0){p.vx-=1.5*vn*nx;p.vy-=1.5*vn*ny;}}
    if(p.y<G.BACK){p.gone=true;p.vx=p.vy=0;continue;}
    const sp=Math.hypot(p.vx,p.vy);if(sp>1)p.ang=Math.atan2(p.vy,p.vx);
    if(sp<14){p.vx=p.vy=0;}else moving=true;}
  if((b.out||s.t>1.2&&b.free&&Math.hypot(b.vx,b.vy)<10)&&!moving)s.done=true;
  if(s.t>6)s.done=true;
}
//SIM-END

// ---------- the lab: one game of five frames, a different field every frame ----------
const FRAMES=5,BALLS=3,SET=.5;
let LOG=[];try{LOG=JSON.parse(localStorage.getItem('fieldlab-log1')||'[]');}catch(e){}
let gameNo=LOG.length?LOG[LOG.length-1].game:0,thrown=false;
const T={speed:.45,win:80,bend:90,risk:1,two:true,cam:'lane'};
try{if(localStorage.getItem('fieldlab-cam')==='top')T.cam='top';}catch(e){}
const cv=document.getElementById('lane'),c=cv.getContext('2d');
const LW=180,LH=300;
function fit(){const box=cv.parentElement.getBoundingClientRect();const s=Math.max(.5,Math.min((box.width-16)/LW,box.height/LH));cv.style.width=Math.floor(LW*s)+'px';cv.style.height=Math.floor(LH*s)+'px';}
window.addEventListener('resize',fit);
// re-fit whenever the lane's space changes (late web fonts, safe areas, the iPhone toolbar), not only on window resize
try{new ResizeObserver(()=>requestAnimationFrame(fit)).observe(cv.parentElement);}catch(e){}
if(window.visualViewport)visualViewport.addEventListener('resize',()=>requestAnimationFrame(fit));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
const still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let g;
function tick(s){stepSim(s,1/240);}
const fieldKey=f=>f.name+(f.flip?'~':'');
const fieldLog=f=>f.name+(f.flip&&f.name===f.nameM?' mirrored':'');
// five different fields for a game; one-sided fields come left- or right-handed at random
function pickFields(){const a=FIELDS.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a.slice(0,FRAMES).map(f=>f.nameM&&Math.random()<.5?mirrorField(f):f);}
function startRange(){return FIELD.start||[G.L+RB+2,G.R-RB-2];}
// a new field: the pins are set in its shape, the last ball's line is wiped, the handles stay where the bowler left them
function setField(f){FIELD=f;g.pins=rack();g.rackBalls=0;g.last=null;g.setT=still?0:SET;g.nameT=1.6;$('fname').textContent=f.name;const r=startRange();g.sx=clamp(g.sx,r[0],r[1]);fixBend();}
function newGame(fields){gameNo++;
  g={n:gameNo,fields:fields||pickFields(),bx:180,zoneAt:.2,ready:false,t0:performance.now(),pend:null,frame:0,frames:[],pins:[],rackBalls:0,sx:180,ex:180,bend:0,power:1,phase:.5,mode:'aim',sim:null,trail:[],last:null,intended:null,err:0,toast:null,toastT:0,wait:0,stopped:0,setT:0,nameT:0};
  g.frames=g.fields.map(f=>({balls:[],marks:[],field:f.name}));setField(g.fields[0]);
  $('over').hidden=true;$('log').hidden=true;$('camBtn').dataset.cam=T.cam;board();setBtn();
  $('hint').textContent='Five frames, three balls each, a different field every frame. Drag the ball, the bend handle and the aim ring, press Ready, then stop the needle in the green.';}
$('camBtn').addEventListener('click',()=>{T.cam=T.cam==='lane'?'top':'lane';drag=null;$('camBtn').dataset.cam=T.cam;try{localStorage.setItem('fieldlab-cam',T.cam);}catch(e){}});
function setBtn(){const b=$('throw');b.disabled=g.mode!=='aim';b.classList.toggle('live',g.mode==='aim'&&g.ready);b.textContent=g.mode==='aim'&&!g.ready?'READY':'THROW';}
function saveLog(){try{localStorage.setItem('fieldlab-log1',JSON.stringify(LOG));}catch(e){}}
const tri=p=>4*Math.abs((((p%1)+1)%1)-.5)-1;
function zone(){return Math.min(.6,T.win/1000*4*needleHz());}
function fixBend(){const mid=(g.sx+g.ex)/2;g.bend=clamp(2*(g.bx-mid),-T.bend,T.bend);g.bx=mid+g.bend/2;}
function needleHz(){return T.speed*(1+T.risk*Math.abs(g.bend)/T.bend)*POW[g.power].needle;}
const sum=a=>a.reduce((t,v)=>t+v,0);
function total(){return sum(g.frames.map(f=>sum(f.balls)));}
function board(){let h='';
  for(let i=0;i<FRAMES;i++){const f=g.frames[i];let m='';for(let k=0;k<BALLS;k++)m+=`<span>${f.marks[k]||''}</span>`;
    h+=`<div class="cell${i===g.frame&&g.mode!=='over'?' now':f.balls.length?' done':''}">${m}</div>`;}
  $('board').innerHTML=h;$('tot').textContent=total();}
// what one ball is worth: each pin carries its own value (5, 3 or 2) wherever the field stands it; a strike doubles, a later clear is ×1.5
function scoreBall(fell,left,fresh){const cleared=left.length===0&&fell.length>0,strike=cleared&&fresh,pts=sum(fell.map(p=>p.v)),m=strike?2:cleared?1.5:1;
  return{pts,m,score:Math.round(pts*m),strike,cleared};}
function throwBall(){if(g.mode!=='aim')return;
  if(!g.ready){g.ready=true;g.phase=Math.random();setBtn();return;}
  const n=tri(g.phase),z=zone(),hz0=needleHz(),ms=Math.round(n/(4*hz0)*1000);let eff=0;if(Math.abs(n)>z)eff=Math.sign(n)*(Math.abs(n)-z)/(1-z);
  g.stopped=n;g.zoneAt=z;g.err=eff;g.intended=makePath(g.sx,g.ex,g.bend);
  const path=makePath(g.sx,g.ex+eff*70,g.bend);
  let clean=null;if(eff!==0){const cp=g.pins.map(q=>Object.assign({},q)),cs=newSim(cp,g.intended,1,g.bend/90);let k=0;while(!cs.done&&k++<2500)tick(cs);clean=cp.filter(q=>q.down).length;}
  g.pend={clean,ms,game:g.n,frame:g.frame+1,ball:g.frames[g.frame].balls.length+1,field:fieldLog(FIELD),start:Math.round(g.sx-180),aim:Math.round(g.ex-180),bend:Math.round(g.bend),drift:Math.round(eff*70),setup:+((performance.now()-g.t0)/1000).toFixed(1),standing:g.pins.length,cam:T.cam};
  g.sim=newSim(g.pins,path,1,g.bend/90);g.trail=[];g.mode='roll';thrown=true;g.rackBalls++;
  setBtn();}
$('throw').addEventListener('click',throwBall);
function resolve(){const fell=g.pins.filter(p=>p.down),left=g.pins.filter(p=>!p.down),r=scoreBall(fell,left,g.rackBalls===1);
  const f=g.frames[g.frame];f.balls.push(r.score);f.marks.push(r.strike?'X':r.cleared?'/':fell.length?String(fell.length):'-');
  const mark=r.strike?'X':r.cleared?'/':'';g.toast=r.score?'x':null;
  $('toast').innerHTML=(mark?`<em>${mark}</em>`:'')+`<strong>+${r.score}</strong>`+(r.m!==1?`<b><span class="pt">${r.pts}</span>×<span class="mu">${r.m}</span></b>`:'');
  g.toastT=1.5;
  if(g.pend){Object.assign(g.pend,{down:fell.length,points:r.pts,mult:r.m,score:r.score});if(g.pend.clean===null)g.pend.clean=fell.length;LOG.push(g.pend);g.pend=null;saveLog();}
  g.last=g.trail;g.pins=left;g.sim=null;let end=false;
  if(f.balls.length>=BALLS){if(g.frame===FRAMES-1)end=true;else{g.frame++;setField(g.fields[g.frame]);}}
  else if(r.cleared){g.pins=rack();g.rackBalls=0;g.setT=still?0:SET;}
  if(end){g.mode='over';board();showOver();}
  else{g.mode='aim';g.ready=false;g.t0=performance.now();board();}
  setBtn();}

// The down-the-lane camera is raised and pulled back for this lab so rack shapes read in depth (pin rows about 11 px apart, not 7).
const LC=(()=>{const D=1400,F=600,A=(278-68)/(1/(D-555)-1/(D-30));return{D,F,A,Y0:278-A/(D-555)};})();
const CAM={

    proj(x,y){const z=LC.D-y;return{X:90+(x-180)*LC.F/z,Y:LC.Y0+LC.A/z,k:LC.F/z};},
    inv(px,py){const z=LC.A/(py+.5-LC.Y0);return{x:180+(px+.5-90)*z/LC.F,y:LC.D-z,k:LC.F/z};}},
  top:{id:'top',horizon:6,
    proj(x,y){return{X:x/2,Y:y/2,k:.5};},

const HY={ball:G.SY,aim:G.EY,bend:(G.SY+G.EY)/2};

// pointer: drag is relative so nothing jumps

  drag={which,x0:p.x,v0:which==='ball'?g.sx:which==='aim'?g.ex:g.bx,k:cm.proj(180,HY[which]).k};try{cv.setPointerCapture(e.pointerId);}catch(_){ }e.preventDefault();});

};
function mix(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t));}
function buildTheme(o){if(o.built)return o;o.built=1;
  o._wood=o.wood.map(hex);o._gut=o.gutter.map(hex);o._line=hex(o.line);o._arrow=hex(o.arrow);o._cap=hex(o.cap);o._pit=hex(o.pit);o._wall=hex(o.wallBase);

// The field is painted here: surface zones, the rail in the gutter, the closed part of the approach.
function shade(o,x,y,sx,sy,k){
  if(y<30)return o._pit;
  const F=FIELD,ax=Math.abs(x-180);let u=ax,s=x-180,nb=false;
  if(ax>=154){s=ax-296;u=Math.abs(s);nb=true;}
  if(u>=142)return o._cap;
  if(u>=120){
    if(!nb&&F.rail&&s*F.rail>0&&u<132&&y<545)return u<122||u>=130||Math.floor(y/45)*45>y-3?o._line:o._rail[Math.floor(y/45)&1];
    return ramp(o._gut,(nb?.1:.2)+(u-120)/22*.6,sx,sy);}
  const bf=(s+120)/BOARD,bi=Math.floor(bf),fr=bf-bi;

  }

function drawPost(o,cm,p){const q=cm.proj(p.x,p.y),X=Math.round(q.X),Y=Math.round(q.Y),r=Math.max(3,Math.round(p.r*q.k));
  if(cm.id==='lane'){const h=Math.round(r*1.5),b=Math.max(2,Math.round(h*.3));
    px(c,X-r-1,Y+1,2*r+3,2,o.shadow);px(c,X-r+1,Y+3,2*r-1,1,o.shadow);
    px(c,X-r,Y-h,2*r+1,h+2,o.edge);px(c,X-r+1,Y+2,2*r-1,1,o.edge);px(c,X-r+1,Y-h-1,2*r-1,1,o.edge);
    px(c,X-r+1,Y-h,2*r-1,h+2,'#b02a1c');px(c,X-r+1,Y-h,2*r-3,h+1,'#d83a2a');px(c,X-r+1,Y-h+b,2*r-1,b,'#d2bf9a');px(c,X-r+1,Y-h+b,2*r-3,b,'#f3e2b8');px(c,X-r+2,Y-h+1,1,h-1,'#ff8a5a');
    return;}
  disc(c,X+1,Y+2,r,o.shadow);disc(c,X,Y,r,o.edge);disc(c,X,Y,r-1,'#d83a2a');disc(c,X,Y,Math.max(1,r-3),'#f3e2b8');disc(c,X,Y,Math.max(0,r-5),'#d83a2a');}
function dots(o,cm,p,dim){let i=0;for(const q of p.pts){if(q.y<G.BACK)break;const s=cm.proj(q.x,q.y),X=Math.round(s.X),Y=Math.round(s.Y);
  if(dim){if(i%2===0)px(c,X,Y,1,1,o.dim);}else if(i%2===0||p.stop&&i>p.pts.length-3){px(c,X,Y+1,1,1,o.dotSh);px(c,X,Y,1,1,o.dot);}i++;}}
function label(o,s,x,y){txt(c,s,x+1,y+1,o.mark);txt(c,s,x,y,o.ink);}
function drawNeedle(o){const x0=22,w=136,y=284,h=8,mid=x0+w/2,half=w/2;
  px(c,0,y-6,LW,LH-(y-6),o.plate);
  px(c,x0-1,y-1,w+2,h+2,o.ui[0]);px(c,x0,y,w,h,o.ui[1]);
  const zz=g.mode==='aim'?zone():g.zoneAt,zw=Math.max(1,Math.round(half*zz));px(c,mid-zw,y,zw*2,h,o.ui[2]);
  if(!(g.mode==='aim'&&T.two&&!g.ready)){const n=g.mode==='aim'?tri(g.phase):g.stopped,nx=Math.round(mid+n*(half-1));px(c,nx-2,y-3,4,h+6,o.ui[0]);px(c,nx-1,y-2,2,h+4,o.ui[3]);}}
function draw(){
  const cm=CAM[T.cam],lane=cm.id==='lane',o=buildTheme(THEME.rec);
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.imageSmoothingEnabled=false;
  c.drawImage(getBg(o,cm).cv,0,0);
  if(lane){const L=o.dispL,R=o.dispR,s=String(total());
    px(c,L[0],L[1],L[2],L[3],L[4]);txt(c,'F'+(g.frame+1),L[0]+Math.floor((L[2]-7)/2),L[1]+Math.floor((L[3]-5)/2),L[5]);
    px(c,R[0],R[1],R[2],R[3],R[4]);txt(c,s,R[0]+Math.floor((R[2]-(s.length*4-1))/2),R[1]+Math.floor((R[3]-5)/2),R[5]);}

  const act=drag?drag.which:null,al=k=>act&&act!==k?.35:1;
  let aimPos=null;
  if(g.mode==='aim'){
    // the last ball's real path, faint; then the line this throw will take through the field
    if(g.last&&g.last.length>1){c.globalAlpha=.6;for(let i=1;i<g.last.length;i++){const a=cm.proj(g.last[i-1].x,g.last[i-1].y),b=cm.proj(g.last[i].x,g.last[i].y);plotLine(c,a.X,a.Y,b.X,b.Y,o.ink);}c.globalAlpha=1;}
    dots(o,cm,makePath(g.sx,g.ex,g.bend),false);
    // aim ring: a mark on the floor in front of the headpin row
    const a=cm.proj(g.ex,G.EY+(lane?24:34)),AX=Math.round(a.X),AY=Math.round(a.Y),rx=lane?9:6,ry=lane?4:6;
    c.globalAlpha=al('aim');if(act==='aim')ringPx(c,AX,AY,rx+3,ry+2,o.hi);
    ringPx(c,AX,AY,rx+1,ry+1,o.edge);ringPx(c,AX,AY,rx,ry,o.handle);px(c,AX-rx-5,AY,4,1,o.handle);px(c,AX+rx+2,AY,4,1,o.handle);c.globalAlpha=1;
    aimPos={X:AX,Y:AY,rx};
  }else if(g.intended){dots(o,cm,g.intended,true);
    for(let i=1;i<g.trail.length;i++){const a=cm.proj(g.trail[i-1].x,g.trail[i-1].y),b=cm.proj(g.trail[i].x,g.trail[i].y);plotLine(c,a.X,a.Y+1,b.X,b.Y+1,o.dotSh);plotLine(c,a.X,a.Y,b.X,b.Y,o.trail);}}

  // pins, posts and ball, far ones first; freshly set pins drop into place
  const lift=g.setT>0?Math.round(g.setT/SET*14):0,ents=[];
  for(const p of g.pins)if(!p.gone)ents.push({y:p.y,p});
  if(FIELD.posts)for(const q of FIELD.posts)ents.push({y:q.y,q});
  const b=g.sim?g.sim.ball:{x:g.sx,y:G.SY};if(!g.sim||!b.out||b.stuck)ents.push({y:b.y+.5,b});
  ents.sort((m,n)=>m.y-n.y);let ballPos=null;
  for(const e of ents){if(e.p)drawPin(o,cm,e.p,lift);else if(e.q)drawPost(o,cm,e.q);else{if(g.mode==='aim')c.globalAlpha=al('ball');ballPos=drawBall(o,cm,e.b);
    if(g.mode==='aim'&&act==='ball')ringPx(c,ballPos.X,ballPos.Y,ballPos.r+3,ballPos.r+3,o.hi);c.globalAlpha=1;}}

  if(g.mode==='aim'){const s=cm.proj(g.bx,HY.bend),X=Math.round(s.X),Y=Math.round(s.Y);
    c.globalAlpha=al('bend');if(act==='bend')ringPx(c,X,Y,10,10,o.hi);
    c.fillStyle=o.edge;for(let d=-7;d<=7;d++){const w=7-Math.abs(d);c.fillRect(X-w,Y+d,2*w+1,1);}
    c.fillStyle=o.handle;for(let d=-6;d<=6;d++){const w=6-Math.abs(d);c.fillRect(X-w,Y+d,2*w+1,1);}
    px(c,X-4,Y,2,1,o.hi);px(c,X-3,Y-1,1,3,o.hi);px(c,X+3,Y,2,1,o.hi);px(c,X+3,Y-1,1,3,o.hi);c.globalAlpha=1;
    if(!thrown){label(o,'AIM',aimPos.X+aimPos.rx+8,aimPos.Y-2);label(o,'BEND',X+11,Y-2);if(ballPos)label(o,'START',ballPos.X+ballPos.r+4,ballPos.Y-2);}
  }
  drawNeedle(o);
}

const toastEl=$('toast'),nameEl=$('fname');
let lastT=0,acc=0;
function loop(ts){const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;
  if(g.mode==='aim'&&g.ready)g.phase+=needleHz()*dt;
  if(g.mode==='roll'){acc+=dt;while(acc>1/240){tick(g.sim);acc-=1/240;}
    const b=g.sim.ball;if(!b.out)g.trail.push({x:b.x,y:b.y});
    if(g.sim.done){g.mode='settle';g.wait=.55;}}
  else if(g.mode==='settle'){g.wait-=dt;if(g.wait<=0)resolve();}
  if(g.toastT>0)g.toastT-=dt;if(g.setT>0)g.setT-=dt;if(g.nameT>0)g.nameT-=dt;
  toastEl.style.opacity=g.toast&&g.toastT>0?Math.min(1,g.toastT*2):0;
  nameEl.style.opacity=g.nameT>0&&g.mode!=='over'?Math.min(1,g.nameT*3):0;   // the field's name, briefly, when it changes
  draw();requestAnimationFrame(loop);}
newGame();fit();requestAnimationFrame(loop);
</script>
